<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; background: #79a854; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Solmar Bay: an open-world crime game. Walk, steal cars, outrun the police and finish three missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./game/src/main.js"></script>
</body>
</html>
